name: Portfolio maintenance regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pytest
      - run: python -m pytest -q tests/test_portfolio_audit.py
      - run: python -m pytest -q
        working-directory: data-science-labs/ds-week-05-longtail-sequential-recommendation
      - run: python run_lab.py --output /tmp/ds05-smoke.json
        working-directory: data-science-labs/ds-week-05-longtail-sequential-recommendation
