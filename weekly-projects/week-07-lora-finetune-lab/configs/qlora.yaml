base_model: Qwen/Qwen2.5-0.5B-Instruct
seed: 42
max_seq_length: 512
learning_rate: 0.0002
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_steps: 100
warmup_ratio: 0.05
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
